    <path d="M8 9h8M8 12.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="star" viewBox="0 0 24 24">
    <path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 2.8 1.1-6.1L3.2 9.4l6.1-.8z" fill="#f4c542" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>
  <symbol id="star-off" viewBox="0 0 24 24">
    <path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 2.8 1.1-6.1L3.2 9.4l6.1-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" opacity=".35"/>
  </symbol>
  <symbol id="cards" viewBox="0 0 24 24">
    <rect x="3" y="6" width="11" height="15" rx="2" transform="rotate(-8 8.5 13.5)" fill="#fff" stroke="currentColor" stroke-width="2"/>
    <rect x="10" y="4" width="11" height="15" rx="2" transform="rotate(8 15.5 11.5)" fill="#f4c542" stroke="currentColor" stroke-width="2"/>
  </symbol>
  <symbol id="sound" viewBox="0 0 24 24">
    <path d="M4 9h3l5-4v14l-5-4H4z" fill="#f4c542" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="mute" viewBox="0 0 24 24">
    <path d="M4 9h3l5-4v14l-5-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" opacity=".5"/>
    <path d="M15.5 9.5 20.5 14.5M20.5 9.5l-5 5" fill="none" stroke="#e8674a" stroke-width="2.4" stroke-linecap="round"/>
  </symbol>
  <symbol id="vibrate" viewBox="0 0 24 24">
    <rect x="8" y="3" width="8" height="18" rx="2" fill="#cfe6ea" stroke="currentColor" stroke-width="2"/>
    <path d="M4.5 8v8M2 10v4M19.5 8v8M22 10v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="vibrate-off" viewBox="0 0 24 24">
    <rect x="8" y="3" width="8" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/>
    <path d="M4 5l16 14" fill="none" stroke="#e8674a" stroke-width="2.4" stroke-linecap="round"/>
  </symbol>
  <symbol id="refresh" viewBox="0 0 24 24">
    <path d="M20 12a8 8 0 1 1-2.3-5.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="share" viewBox="0 0 24 24">
    <path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="18" cy="5" r="3" fill="#fff" stroke="currentColor" stroke-width="2"/>
    <circle cx="6" cy="12" r="3" fill="#fff" stroke="currentColor" stroke-width="2"/>
    <circle cx="18" cy="19" r="3" fill="#fff" stroke="currentColor" stroke-width="2"/>
  </symbol>
  <symbol id="phone" viewBox="0 0 24 24">
    <rect x="6.5" y="2.5" width="11" height="19" rx="2.5" fill="#cfe6ea" stroke="currentColor" stroke-width="2"/>
    <path d="M10.5 18.5h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
