<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 地理王 オリジナルアイコン集。24x24、線は currentColor、塗りは .fill-accent / .fill-primary で色付け -->
  <symbol id="crown" viewBox="0 0 24 24">
    <path class="fa" d="M3.5 17.5 5 8.5l4.6 3.6L12 5l2.4 7.1L19 8.5l1.5 9z" fill="#f4c542" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <rect x="3.5" y="17.5" width="17" height="3" rx="1" fill="#f4c542" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="13.5" r="1.4" fill="currentColor"/>
  </symbol>
  <symbol id="globe" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="#cfe6ea" stroke="currentColor" stroke-width="2"/>
    <ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M3 12h18M4.6 7.5h14.8M4.6 16.5h14.8" fill="none" stroke="currentColor" stroke-width="2"/>
  </symbol>
  <symbol id="flag" viewBox="0 0 24 24">
    <path d="M5 21V3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M5 4c3-2 6 2 9 0s4 0 5 .5V14c-1-.5-2-2.5-5-.5s-6-2-9 0z" fill="#e8674a" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>
  <symbol id="weather" viewBox="0 0 24 24">
    <circle cx="9" cy="9" r="4" fill="#f4c542" stroke="currentColor" stroke-width="2"/>
    <path d="M9 2v1.5M9 14.5V16M2 9h1.5M14.5 9H16M4 4l1 1M13 4l-1 1M4 14l1-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M11 20h7.5a3 3 0 0 0 .4-6 4.5 4.5 0 0 0-8.6 1.2A2.5 2.5 0 0 0 11 20z" fill="#fff" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>
  <symbol id="temple" viewBox="0 0 24 24">
    <path d="M3 9 12 3l9 6z" fill="#1f6f4a" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M6 9v9M12 9v9M18 9v9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="3" y="18" width="18" height="3" rx="1" fill="#f4c542" stroke="currentColor" stroke-width="2"/>
  </symbol>
  <symbol id="city" viewBox="0 0 24 24">
    <rect x="3" y="10" width="6" height="11" fill="#cfe6ea" stroke="currentColor" stroke-width="2"/>
    <rect x="9" y="4" width="7" height="17" fill="#fff" stroke="currentColor" stroke-width="2"/>
    <rect x="16" y="12" width="5" height="9" fill="#f4c542" stroke="currentColor" stroke-width="2"/>
    <path d="M11.5 8h2M11.5 12h2M11.5 16h2M5 14h2M5 17.5h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
  <symbol id="check" viewBox="0 0 24 24">
    <path d="M4.5 12.5 9.5 17.5 19.5 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="#fff" stroke="currentColor" stroke-width="2"/>
    <path d="M12 7v5.5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="trophy" viewBox="0 0 24 24">
    <path d="M7 4h10v5a5 5 0 0 1-10 0z" fill="#f4c542" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M7 6H4.5a2.5 2.5 0 0 0 2.5 4M17 6h2.5a2.5 2.5 0 0 1-2.5 4M12 14v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <rect x="7.5" y="17" width="9" height="3.5" rx="1" fill="#f4c542" stroke="currentColor" stroke-width="2"/>
  </symbol>
  <symbol id="pin" viewBox="0 0 24 24">
