    <path d="M12 8V4M9.5 4h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="9" cy="13.5" r="1.5" fill="currentColor"/><circle cx="15" cy="13.5" r="1.5" fill="currentColor"/>
    <path d="M9 17h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="person" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4" fill="#f4c542" stroke="currentColor" stroke-width="2"/>
    <path d="M4.5 21a7.5 7.5 0 0 1 15 0z" fill="#fff" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>
  <symbol id="door" viewBox="0 0 24 24">
    <path d="M13 3H5v18h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 12h11M17 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="copy" viewBox="0 0 24 24">
    <rect x="8" y="8" width="12" height="12" rx="2" fill="#fff" stroke="currentColor" stroke-width="2"/>
    <path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" fill="none" stroke="currentColor" stroke-width="2"/>
  </symbol>
  <symbol id="chat" viewBox="0 0 24 24">
